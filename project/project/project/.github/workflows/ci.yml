name: CI

# Basic CI: type-check, production build, and lint.
# NOTE: `working-directory` below assumes this workflow file lives at the
# repository root and the app lives at `project/luxe-commerce_updated/luxe-commerce`
# relative to it (see the project-structure notes from this audit pass —
# the extracted archive contains a duplicated `project/` folder, so please
# confirm this path matches your actual repo layout before relying on this
# workflow, and adjust the `working-directory` value below if not).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/luxe-commerce_updated/luxe-commerce
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project/luxe-commerce_updated/luxe-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
